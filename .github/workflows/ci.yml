name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install visual-check browser
        # ubuntu-24.04 already carries Chromium's shared libraries. Avoid
        # refreshing unrelated third-party apt indexes, which can race mirrors.
        run: npx playwright install chromium

      - name: Render phone, landscape and desktop; prove blank-world detector
        run: xvfb-run -a npx playwright test

      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorelands-visual-evidence
          path: test-results/
          retention-days: 14

      - name: Report client bundle size
        run: |
          echo "### Client bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -bh packages/client/dist/assets/*.js | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
