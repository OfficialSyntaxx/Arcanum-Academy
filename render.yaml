# Render blueprint for the authoritative game server.
#
# Why a long-running web service rather than a serverless function: the gateway
# holds persistent WebSocket connections for session resume and heartbeats.
# Serverless request/response platforms cannot host it.
#
# The free plan sleeps after roughly fifteen minutes of inactivity and cold
# starts in 30-60 seconds. That is acceptable for a demo link and painful for
# real play; move to a paid instance or Fly.io before players arrive.
#
# Apply from the Render dashboard: New > Blueprint, pick this repository.
# ALLOWED_ORIGINS is deliberately left unset here - fill it in the dashboard
# with the deployed client origin once Netlify has issued one.

services:
  - type: web
    name: arcanum-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    # Two deliberate choices here:
    #
    # --include=dev is required because NODE_ENV is production below, and npm
    # omits devDependencies entirely when it sees that. The compiler, the type
    # definitions and esbuild all live in devDependencies, so without this the
    # build has no toolchain and fails on the first import.
    #
    # npm install rather than npm ci because esbuild was added to the server
    # package after the lockfile was last generated, and no machine with Node
    # attached has regenerated it yet. Switch back to `npm ci --include=dev`
    # the moment package-lock.json is refreshed and committed - ci is
    # reproducible and install is not.
    buildCommand: npm install --include=dev && npm run build --workspace @arcanum/server
    startCommand: npm run start --workspace @arcanum/server
    envVars:
      # Must match .nvmrc.
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render injects PORT itself and the server already reads it, so it is
      # not declared here. HOST defaults to 0.0.0.0, which is what Render needs.
      - key: MAX_CONNECTIONS
        value: '200'
      - key: SESSION_RESUME_SECONDS
        value: '120'
      # Set in the dashboard to the Netlify origin, e.g.
      # https://arcanum-academy.netlify.app - a wrong value here silently
      # rejects every browser connection in production.
      - key: ALLOWED_ORIGINS
        sync: false
