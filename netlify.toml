# Netlify configuration for the client PWA.
#
# Netlify hosts the client only. The game server is a long-running WebSocket
# process and cannot run on Netlify Functions - see render.yaml.
#
# VITE_SERVER_URL is read at build time by App.tsx and falls back to
# ws://localhost:8787 when unset, so local development needs no configuration.
# Set it in the Netlify dashboard to the wss:// origin of the deployed server.
# It must be wss:// and not ws://: a page served over HTTPS is forbidden by the
# browser from opening an insecure WebSocket.

[build]
  command = "npm run build --workspace @arcanum/client"
  publish = "packages/client/dist"

[build.environment]
  NODE_VERSION = "22"

# The client is a single-page app: every route must serve index.html rather
# than 404, or a deep link and a refresh both break.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or returning players are pinned to
# a stale build. Hashed assets under /assets are immutable and cached hard.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
